aid: iodine-software-waystar
name: Iodine Software (Waystar)
description: >-
  Iodine Software is a healthcare AI company whose AwareCDI suite applies
  clinical machine learning to the mid-revenue cycle, surfacing clinical
  documentation integrity (CDI) gaps, prioritizing high-impact cases, and
  automating physician queries so hospitals and health systems capture the
  complete patient story for more accurate coding, quality metrics, and revenue
  capture. Its Concurrent, Retrospective, and Interact modules integrate
  directly into existing EHR and coding workflows rather than exposing a public
  developer API. Founded in Austin, Texas, Iodine was acquired by revenue-cycle
  technology company Waystar in October 2025, and its products, blog, newsroom,
  and legal pages now live under waystar.com and its AltitudeAI platform. It was
  surfaced in the API Evangelist network as a Bain Capital Ventures portfolio
  company in the healthcare sector.
